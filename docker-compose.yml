version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog_app_image_flask
    container_name: flask_blog
    ports:
      - "5008:5008"
    volumes:
      - .:/app
    environment:
      FLASK_DEBUG: "1"
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
